<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Contact</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Contact</h1>
        <p>Get in touch via any of the links below.</p>
    </header>
    <!-- Bonus: All links are contained in a nav element -->
    <nav class="nav">
        <!-- Link to the Home page using a relative path in the same folder -->
        <a href="index.html">Index</a>
        <!-- Link to the About page using a relative path in the same folder -->
        <a href="about.html">About</a>
        <!-- This link opens a local image in a new tab; target="_blank" opens a new tab, I added this simply because you mentioned being unable to on school computers. -->
        <a href="hors.jpg" target="_blank">Seahorse</a>
        <!-- This link uses an anchor link to a specific header in a declared website. -->
        <a href="https://frankbuck.org/link-specific-page-part/#:~:text=Here%E2%80%99s%20how%20to%20create%20a%20link%E2%80%A6" target="_blank">Link Specific Header in Page</a>
    </nav>
    <div class="card">
        <p>Tip: These buttons are keyboard-accessible and have clear focus styles.</p>
    </div>
</div>
</body>
</html>
